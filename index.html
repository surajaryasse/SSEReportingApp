/* ===== V15 PROFESSIONAL UI ===== */
:root{
 --navy:#0b1f3a;--blue:#155eef;--blue2:#0b63ce;--bg:#f5f7fb;--card:#fff;
 --text:#182230;--muted:#667085;--line:#e4e7ec;--green:#12b76a;--red:#f04438;
 --amber:#f79009;--shadow:0 8px 24px rgba(16,24,40,.07);
}
body{background:var(--bg);color:var(--text);font-size:14px}
.top{background:linear-gradient(135deg,#071a31 0%,#0d315b 55%,#155eef 100%);padding:14px 20px;box-shadow:0 3px 14px rgba(0,0,0,.14)}
.top img{width:46px;height:46px;border:2px solid rgba(255,255,255,.28);box-shadow:0 3px 10px rgba(0,0,0,.18)}
.top h1{font-size:19px;letter-spacing:.1px}
.top small{font-size:11px;opacity:.8}
.wrap{max-width:1180px;padding:20px}
.nav{padding:12px 0 15px;gap:7px}
.nav .btn{border:1px solid var(--line);background:#fff;color:#344054;box-shadow:0 1px 2px rgba(16,24,40,.04);font-size:13px;padding:9px 13px}
.nav .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn{border-radius:10px;border:1px solid var(--line);font-weight:700;transition:.15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,24,40,.09)}
.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.success{background:var(--green);border-color:var(--green);color:#fff}
.danger{background:#fff1f0;border-color:#ffd6d2;color:#b42318}
.card,.section-card{border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px}
.card{padding:19px}.section-card{padding:19px}
h2{font-size:20px;letter-spacing:-.2px}h3{font-size:16px}
.muted{color:var(--muted)}
input,select,textarea{border:1px solid #d0d5dd;border-radius:9px;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:#84adff;box-shadow:0 0 0 3px rgba(21,94,239,.10)}
label{font-size:13px;color:#344054}
.dash-hero{border-radius:18px;padding:21px;box-shadow:0 12px 30px rgba(16,24,40,.12)}
.dash-grid{gap:12px}
.dash-card{border-radius:15px;box-shadow:var(--shadow);border:1px solid var(--line)}
.dash-card .icon{background:#eef4ff}
.dash-card .big{font-size:28px}
.dashboard-modules-top{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.module-top-title{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:#344054}
.dashboard-modules-top .module-choice-grid{gap:9px}
.dashboard-modules-top .module-choice,.module-choice{
 border:1px solid #e4e7ec;border-radius:12px;background:#fff;
 box-shadow:0 1px 2px rgba(16,24,40,.03);transition:.15s ease
}
.dashboard-modules-top .module-choice:hover,.module-choice:hover{border-color:#b2ccff;box-shadow:0 5px 16px rgba(16,24,40,.08);transform:translateY(-1px)}
.module-choice .module-icon,.dashboard-modules-top .module-icon{font-size:22px}
.form-grid{gap:14px}
.form-grid label{font-size:13px}
.permit-type-grid{gap:8px}
.permit-type-btn{border:1px solid #d0d5dd;background:#fff;color:#344054;transition:.15s ease}
.permit-type-btn:hover{border-color:#84adff;background:#f8fbff}
.permit-type-btn.active{border:2px solid var(--blue);background:#eff6ff;color:#084298}
.labour-row{background:#fafbfc;border-radius:10px;padding:4px}
.labour-no{background:#e9eef5;color:#344054}
.item{border:1px solid var(--line);border-radius:12px;background:#fff}
.badge{border:1px solid #e4e7ec;background:#f8fafc;color:#475467}
.approved{background:#ecfdf3;border-color:#abefc6;color:#067647}
.pending{background:#fffaeb;border-color:#fedf89;color:#b54708}
.rejected{background:#fef3f2;border-color:#fecdca;color:#b42318}
.required{color:#d92d20}
.notice{border-color:#d9e2f0;background:#f8fbff}
.visibility-row{background:#fff;border-color:var(--line)}
.footer{padding:26px;color:#98a2b3}
.photo-preview,.permit-photo{border:1px solid var(--line);box-shadow:0 3px 12px rgba(16,24,40,.08)}
.login{border-radius:20px;box-shadow:0 16px 40px rgba(16,24,40,.10)}
.login .logo{box-shadow:0 8px 24px rgba(16,24,40,.10)}
@media(max-width:600px){
 .wrap{padding:12px}
 .dashboard-modules-top{padding:13px}
 .dash-hero{padding:17px}
 .top{padding:12px 14px}
}
.access-grid{display:grid;gap:12px;margin-top:14px}
.access-member-card{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;box-shadow:0 3px 12px rgba(16,24,40,.04)}
.access-list{display:grid;gap:8px;margin-top:12px}
.access-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid #e4e7ec;border-radius:12px;padding:10px 11px;background:#fbfcfe}
.access-row small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.access-toggle{min-width:118px;padding:9px 10px;border-radius:10px;font-weight:800;font-size:11px;border:1px solid;cursor:pointer}
.access-toggle.on{background:#ecfdf3;border-color:#abefc6;color:#067647}
.access-toggle.off{background:#fef3f2;border-color:#fecdca;color:#b42318}
@media(max-width:520px){.access-row{align-items:flex-start;flex-direction:column}.access-toggle{width:100%}}
.access-member-select{font-size:15px;font-weight:700;padding:13px 14px;border:2px solid #d0d5dd;background:#fff}
.selected-member-banner{display:flex;align-items:center;gap:12px;margin-top:14px;padding:13px 14px;border:1px solid #cfe0f5;border-radius:13px;background:#f5f9ff}

.selected-access-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
@media(max-width:520px){.selected-access-row{flex-direction:column;align-items:stretch}.selected-access-row .access-toggle{width:100%}}

/* ===== V20 POLISH LAYER ===== */
:root{
  --v20-surface:#ffffff;
  --v20-soft:#f7f9fc;
  --v20-blue:#155eef;
  --v20-navy:#071a31;
}
html{scroll-behavior:smooth}
body{letter-spacing:-.05px}
.top{backdrop-filter:saturate(140%) blur(8px)}
.top .user-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;color:#fff;margin-right:7px}
.top .user-dot{width:8px;height:8px;border-radius:50%;background:#32d583;box-shadow:0 0 0 3px rgba(50,213,131,.12)}
.btn:active{transform:translateY(0) scale(.98)}
.card,.section-card,.dash-card,.dashboard-modules-top{overflow:hidden}
.dash-card{min-height:132px}
.dash-card .label{display:flex;align-items:center;gap:5px}
.dash-card .hint{line-height:1.35}
.section-card .section-head h2{display:flex;align-items:center;gap:7px}
.module-choice,.module-dashboard-card{position:relative;overflow:hidden}
.module-choice:before,.module-dashboard-card:before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(21,94,239,.035),transparent 55%);pointer-events:none}
.form-grid input,.form-grid select,.form-grid textarea{min-height:44px}
textarea{line-height:1.45}
input[type=file]{padding:10px;background:#fbfcfe}
.photo-preview,.permit-photo{background:#f7f9fc}
.notice{box-shadow:0 2px 8px rgba(16,24,40,.03)}
.empty{border:1px dashed #d7dde7;border-radius:12px;background:#fbfcfe}
.v20-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.v20-toolbar .title{font-weight:800;font-size:15px}
.v20-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.v20-kpi{border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--v20-soft)}
.v20-kpi b{display:block;font-size:20px;margin-top:2px}
.v20-kpi span{font-size:11px;color:var(--muted)}
.v20-search{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.v20-search input{flex:1;min-width:0}
.v20-search .btn{white-space:nowrap}
.v20-toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;z-index:9999;pointer-events:none;background:#101828;color:#fff;padding:11px 15px;border-radius:12px;box-shadow:0 12px 30px rgba(16,24,40,.22);font-size:13px;font-weight:700;transition:.22s ease;max-width:min(92vw,420px);text-align:center}
.v20-toast.show{opacity:1;transform:translate(-50%,0)}
.v20-bottom-nav{display:none}
@media(max-width:600px){
  .top{position:sticky;top:0}
  .top .user-chip{display:none}
  .top h1{font-size:16px}
  .top small{font-size:10px}
  .top img{width:40px;height:40px}
  .dash-grid{grid-template-columns:1fr 1fr}
  .dash-card{min-height:124px}
  .v20-kpi-row{grid-template-columns:1fr 1fr 1fr}

<script>
const KEY='sse_reporting_v1';'sse_reporting_v1';
const state=JSON.parse(localStorage.getItem(KEY)||'null')||{user:null,reports:[],requests:[],attendance:[],members:[{name:'Team Member 1',assignedSites:[]},{name:'Team Member 2',assignedSites:[]}],sites:[],settings:{}};
state.settings=state.settings||{};
state.settings.version='V61 FULL SYSTEM RELIABILITY';
state.notifications=Array.isArray(state.notifications)?state.notifications:[];
state.notificationReceipts=Array.isArray(state.notificationReceipts)?state.notificationReceipts:[];
state.settings.pushVapidKey=state.settings.pushVapidKey||'';
state.settings.labels=Object.assign({appName:'SSE Reporting App',dailyReport:'Daily Work Report',attendance:'Attendance',material:'Material Request',workPermit:'Work Permit',tbt:'TBT Photo',site:'Site',tower:'Tower',floor:'Floor',materialField:'Material'},state.settings.labels||{});
state.settings.permitTypes=Array.isArray(state.settings.permitTypes)&&state.settings.permitTypes.length?state.settings.permitTypes:[{name:'Day Permit',icon:'☀️'},{name:'Night Permit',icon:'🌙'},{name:'Height Work',icon:'🪜'},{name:'Hot Work',icon:'🔥'},{name:'Fabrication Work',icon:'🔧'},{name:'Other Permit',icon:'📋'}];
state.settings.materials=Array.isArray(state.settings.materials)?state.settings.materials:[];
state.settings.units=Array.isArray(state.settings.units)&&state.settings.units.length?state.settings.units:['Bags','Kg','Ton','Nos','Meter','Sq.ft','Other'];
state.settings.dashboardDisabled=Array.isArray(state.settings.dashboardDisabled)?state.settings.dashboardDisabled:[];
state.reports=Array.isArray(state.reports)?state.reports:[];state.requests=Array.isArray(state.requests)?state.requests:[];state.attendance=Array.isArray(state.attendance)?state.attendance:[];state.sites=Array.isArray(state.sites)?state.sites:[];state.members=Array.isArray(state.members)?state.members:[];state.moduleRecords=state.moduleRecords&&typeof state.moduleRecords==='object'?state.moduleRecords:{};state.moduleRecords.tbt=Array.isArray(state.moduleRecords.tbt)?state.moduleRecords.tbt:[];state.moduleRecords.workPermit=Array.isArray(state.moduleRecords.workPermit)?state.moduleRecords.workPermit:[];
if(Array.isArray(state.attendance)){
  const seenAttendance=new Map();
  state.attendance.forEach(a=>{ if(a && a.name && a.date) seenAttendance.set(a.name+'|'+a.date,a); });
  state.attendance=[...seenAttendance.values()];
}
state.members=(state.members||[]).map(m=>{
  const x=typeof m==='string'?{name:m,assignedSites:[]}:((m&&m.assignedSites)?m:{...m,assignedSites:[]});
  if(!x.id) x.id=crypto.randomUUID();
  return x;
});
state.members.forEach(m=>{if(!m.id)m.id=crypto.randomUUID();});
save();
const $=s=>document.querySelector(s);
function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
  // Manager writes to cloud. If the Firebase JS SDK is available, use it.
  // When Android opens the downloaded HTML as content://, use Firestore REST
  // with the ID token from direct Firebase Authentication instead.
  if(state.user?.role==='manager' && !window.SSEFirebase.syncing){
    if(window.SSEFirebase?.ready && window.SSEFirebase.user) cloudSave();
    else if(state.authSession?.idToken) cloudRestSave();
  }
}
let cloudSaveTimer=null;
let cloudRestSaveTimer=null;
let cloudRestSyncTimer=null;

function cloudPayload(){
  const copy=JSON.parse(JSON.stringify(state));
  copy.user=null;
  // Never store Firebase ID/refresh tokens inside Firestore.
  delete copy.authSession;
  return copy;
}

// V42: preserve submissions arriving from Team phones when Manager saves
// settings/status changes at nearly the same time.
function recordKey(item, fallbackIndex){
  if(!item || typeof item!=='object')return 'value:'+String(item);
  if(item.id)return 'id:'+item.id;
  if(item.name && item.date)return 'attendance:'+item.name+'|'+item.date;
  return 'fallback:'+fallbackIndex+':'+JSON.stringify(item);
}
function mergeRecordArrays(localRows, remoteRows){
  const result=Array.isArray(localRows)?localRows.slice():[];
  const seen=new Set(result.map(recordKey));
  (Array.isArray(remoteRows)?remoteRows:[]).forEach((row,i)=>{
    const key=recordKey(row,i);
    if(!seen.has(key)){seen.add(key);result.push(row);}
  });
  return result;
}
function mergeIncomingSubmissions(localData, remoteData){
  const merged={...remoteData,...localData};
  ['reports','requests','attendance','notifications'].forEach(k=>{
    merged[k]=mergeRecordArrays(localData?.[k],remoteData?.[k]);
  });
  merged.notifications=mergeRecordArrays(localData?.notifications,remoteData?.notifications);
  merged.notificationReceipts=mergeRecordArrays(localData?.notificationReceipts,remoteData?.notificationReceipts);
  merged.moduleRecords={...(remoteData?.moduleRecords||{}),...(localData?.moduleRecords||{})};
  ['tbt','workPermit'].forEach(k=>{
    merged.moduleRecords[k]=mergeRecordArrays(localData?.moduleRecords?.[k],remoteData?.moduleRecords?.[k]);
  });
  return merged;
}
function cloudSave(){
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer=setTimeout(async()=>{
    try{
      if(!window.SSEFirebase?.user || window.SSEFirebase.syncing)return;
      const ref=window.SSEFirebase.doc(window.SSEFirebase.db,'appData','main');
      const snap=await window.SSEFirebase.getDoc(ref);
      const remote=snap.exists()?(snap.data()||{}):{};
      const payload=mergeIncomingSubmissions(cloudPayload(),remote);
      payload.user=null;
      delete payload.authSession;
      await window.SSEFirebase.setDoc(ref,payload,{merge:false});
    }catch(e){console.error('Cloud save failed',e);}
  },250);
}

// ---------- V37 Firestore REST fallback for Android content:// ----------
const FIRESTORE_DOC_URL='https://firestore.googleapis.com/v1/projects/'+
  encodeURIComponent(window.SSEFirebaseConfig.projectId)+'/databases/(default)/documents/appData/main';

function firestoreValue(v){
  if(v===null || typeof v==='undefined') return {nullValue:null};
  if(typeof v==='boolean') return {booleanValue:v};
  if(typeof v==='number'){
    return Number.isInteger(v) ? {integerValue:String(v)} : {doubleValue:v};
  }
  if(typeof v==='string') return {stringValue:v};
  if(Array.isArray(v)) return {arrayValue:{values:v.map(firestoreValue)}};
  if(typeof v==='object'){
    const fields={};
    Object.keys(v).forEach(k=>{fields[k]=firestoreValue(v[k]);});
    return {mapValue:{fields}};
  }
  return {stringValue:String(v)};
}
function fromFirestoreValue(x){
  if(!x)return null;
  if('nullValue' in x)return null;
  if('booleanValue' in x)return !!x.booleanValue;
  if('integerValue' in x)return Number(x.integerValue);
  if('doubleValue' in x)return Number(x.doubleValue);
  if('timestampValue' in x)return x.timestampValue;
  if('stringValue' in x)return x.stringValue;
  if('bytesValue' in x)return x.bytesValue;
  if('referenceValue' in x)return x.referenceValue;
  if('arrayValue' in x)return (x.arrayValue?.values||[]).map(fromFirestoreValue);
  if('mapValue' in x){
    const out={};
    Object.entries(x.mapValue?.fields||{}).forEach(([k,v])=>out[k]=fromFirestoreValue(v));
    return out;
  }
  return null;
}
function fromFirestoreDoc(doc){
  const out={};
  Object.entries(doc?.fields||{}).forEach(([k,v])=>out[k]=fromFirestoreValue(v));
  return out;
}
async function cloudRestGet(){
  const token=state.authSession?.idToken;
  if(!token)return null;
  const r=await fetch(FIRESTORE_DOC_URL,{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('Cloud read failed ('+r.status+')');
  return fromFirestoreDoc(await r.json());
}

// V40: Team members append their own submissions to Firestore without
// uploading their whole local state. This prevents a team phone from
// overwriting the Manager's latest sites, members, permissions or requests.
async function cloudRestAppendArray(fieldPath,item){
  if(state.user?.role==='manager')return true;
  const token=state.authSession?.idToken;
  if(!token || !item)return false;
  try{
    const url='https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(window.SSEFirebaseConfig.projectId)+'/databases/(default)/documents:commit';
    const body={writes:[{transform:{document:'projects/'+window.SSEFirebaseConfig.projectId+'/databases/(default)/documents/appData/main',fieldTransforms:[{fieldPath,appendMissingElements:{values:[firestoreValue(item)]}}]}}]};
    const r=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){console.error('Team cloud append failed',fieldPath,r.status,await r.text());return false;}
    // Immediately pull the shared document so this phone stays current too.
    await syncRestNow(false);
    return true;
  }catch(e){console.error('Team cloud append failed',fieldPath,e);return false;}
}

let restSyncInFlight=false;
async function syncRestNow(allowManagerWrite=true){
  if(restSyncInFlight)return false;
  restSyncInFlight=true;
  try{
    const incoming=await cloudRestGet();
    if(!incoming)return false;
    const currentUser=state.user;
    const currentSession=state.authSession;
    // Merge submission arrays instead of dropping a Team record that arrived
    // just before this poll. Cloud master settings remain the shared source.
    const merged=mergeIncomingSubmissions(incoming,incoming);
    window.SSEFirebase.syncing=true;
    Object.assign(state,merged);
    state.user=currentUser;
    if(currentSession)state.authSession=currentSession;
    window.SSEFirebase.syncing=false;
    localStorage.setItem(KEY,JSON.stringify(state));
    // V49 FIX: never rerender/navigate during background cloud polling.
    // Re-rendering called render() -> page('dashboard'), kicking users out
    // of forms while typing on both manager and team devices. Keep the current
    // screen and inputs intact; latest cloud data is used on the next navigation.
    return true;
  }catch(e){
    window.SSEFirebase.syncing=false;
    throw e;
  }finally{
    restSyncInFlight=false;
  }
}

async function cloudRestSave(){
  clearTimeout(cloudRestSaveTimer);
  cloudRestSaveTimer=setTimeout(async()=>{
    try{
      const token=state.authSession?.idToken;
      if(!token || state.user?.role!=='manager')return;
      let payload=cloudPayload();
      try{
        const remote=await cloudRestGet();
        if(remote)payload=mergeIncomingSubmissions(payload,remote);
      }catch(readError){console.warn('Could not pre-merge latest cloud submissions:',readError);}
      payload.user=null;
      delete payload.authSession;
      const body={fields:{}};
      Object.entries(payload).forEach(([k,v])=>body.fields[k]=firestoreValue(v));
      const r=await fetch(FIRESTORE_DOC_URL,{
        method:'PATCH',
        headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
      if(!r.ok)console.error('Cloud REST save failed',r.status,await r.text());
    }catch(e){console.error('Cloud REST save failed',e);}
  },150);
}
async function startRestCloudSync(){
  if(!state.authSession?.idToken)return;
  try{
    await syncRestNow(false);
    if(!await cloudRestGet() && state.user?.role==='manager') await cloudRestSave();
  }catch(e){console.warn('REST cloud sync unavailable:',e);}
  clearInterval(cloudRestSyncTimer);
  // Keep both phones live. This is intentionally independent of the Firebase
  // JS SDK so Android content:// opens still receive new data without
  // needing the user to download/open a newer HTML file.
  cloudRestSyncTimer=setInterval(async()=>{
    try{
      if(!state.user || !state.authSession?.idToken || restSyncInFlight)return;
      await syncRestNow(false);
    }catch(e){console.warn('REST cloud polling failed:',e);}
  },2000);
}
async function startCloudSync(user){
  if(!window.SSEFirebase?.ready || !user)return;
  try{
    if(window.SSEFirebase.unsubscribe)window.SSEFirebase.unsubscribe();
    const ref=window.SSEFirebase.doc(window.SSEFirebase.db,'appData','main');
    const snap=await window.SSEFirebase.getDoc(ref);
    if(snap.exists()){
      window.SSEFirebase.syncing=true;
      Object.assign(state,snap.data()||{});
      state.user={role:user.email?.toLowerCase()==='silverstarenterprises51@gmail.com'?'manager':'team',name:state.user?.name||user.email?.split('@')[0]||'User',email:user.email,uid:user.uid};
      window.SSEFirebase.syncing=false;
      localStorage.setItem(KEY,JSON.stringify(state));
    } else if(state.user?.role==='manager'){
      await window.SSEFirebase.setDoc(ref,cloudPayload(),{merge:false});
    }
    window.SSEFirebase.unsubscribe=window.SSEFirebase.onSnapshot(ref,(d)=>{
      if(!d.exists() || window.SSEFirebase.syncing)return;
      const incoming=d.data()||{};
      window.SSEFirebase.syncing=true;
      const currentUser=state.user;
      const currentSession=state.authSession;
      Object.assign(state,incoming);
      state.user=currentUser;
      if(currentSession)state.authSession=currentSession;
      window.SSEFirebase.syncing=false;
      localStorage.setItem(KEY,JSON.stringify(state));
      if(state.user) render();
    },e=>console.error('Cloud sync failed',e));
    localStorage.setItem(KEY,JSON.stringify(state));
  }catch(e){console.error('Cloud sync start failed',e);}
}

function ensureProcessingOverlay(){
  if(document.getElementById('sseProcessingOverlay'))return;
  const el=document.createElement('div');
  el.id='sseProcessingOverlay';
  el.innerHTML='<div class="sse-processing-box"><div class="sse-processing-ring"><span class="sse-processing-count">1/10</span></div><div class="sse-processing-done">✓</div><div class="sse-processing-title" id="sseProcessingTitle">Processing…</div><div class="sse-processing-sub" id="sseProcessingSub">Please wait</div></div>';
  document.body.appendChild(el);

function startProcessing(title='Processing…',sub='Please wait'){
  ensureProcessingOverlay();
  const overlay=document.getElementById('sseProcessingOverlay');
  const box=overlay.querySelector('.sse-processing-box');
  box.classList.remove('done');
  document.getElementById('sseProcessingTitle').textContent=title;
  document.getElementById('sseProcessingSub').textContent=sub;
  const count=overlay.querySelector('.sse-processing-count');
  let n=1; count.textContent='1/10';
  clearInterval(window._sseProcessingTimer);
  window._sseProcessingTimer=setInterval(()=>{if(n<10){n++;count.textContent=n+'/10'}},90);
  overlay.classList.add('show');
  return overlay;
}
function finishProcessing(success=true,delay=450){
  const overlay=document.getElementById('sseProcessingOverlay');
  if(!overlay)return;
  clearInterval(window._sseProcessingTimer);
  const box=overlay.querySelector('.sse-processing-box');
  if(success){box.classList.add('done');document.getElementById('sseProcessingTitle').textContent='Done';document.getElementById('sseProcessingSub').textContent='Process completed successfully';}
  setTimeout(()=>{overlay.classList.remove('show');box.classList.remove('done')},delay);
}

async function doLogin(){
 const email=$('#email')?.value.trim(), password=$('#password')?.value||'';
 if(!email||!password)return alert('Email and password are required.');

 const btn=document.querySelector('button[onclick="doLogin()"]');
 if(btn){btn.disabled=true;btn.textContent='Signing in…';}
 startProcessing('Logging in…','Connecting securely to Firebase');

 try{
   // V37: Direct Firebase Auth REST fallback.
   // This works even when the HTML is opened from Android content://downloads/
   // and the Firebase ES-module SDK cannot initialize inside the file viewer.
   const endpoint='https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+
     encodeURIComponent(window.SSEFirebaseConfig.apiKey);
   const resp=await fetch(endpoint,{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({email,password,returnSecureToken:true})
   });
   const data=await resp.json().catch(()=>({}));
   if(!resp.ok){
     const code=data?.error?.message||'';
     const err=new Error(code);
     err.code=code;
     throw err;
   }

   const role=email.toLowerCase()==='silverstarenterprises51@gmail.com'?'manager':'team';
   state.user={role,name:email.split('@')[0],email:email,uid:data.localId};
   // Keep the Auth session locally so reopening the downloaded app can restore it.
   state.authSession={
     idToken:data.idToken||'',
     refreshToken:data.refreshToken||'',
     expiresIn:data.expiresIn||'3600',
     issuedAt:Date.now()
   };
   localStorage.setItem(KEY,JSON.stringify(state));

   // Login is complete. Never wait for the Firebase JS SDK or Firestore here.
   render();
   toast('Login successful');
   finishProcessing(true);

   // Direct-login mode must also sync with Firestore. This is the path used
   // when Android opens the HTML as content://downloads/...
   startRestCloudSync().catch(e=>console.warn('Initial REST sync unavailable:',e));

   // If the normal Firebase SDK loads, silently establish its session too,
   // then start Firestore sync in the background.
   window.firebaseReady.then(async fb=>{
     if(!fb?.ready)return;
     try{
       const cred=await fb.signInWithEmailAndPassword(fb.auth,email,password);
       await startCloudSync(cred.user);
       render();
     }catch(e){console.warn('Optional SDK/cloud sync unavailable:',e);}
   }).catch(e=>console.warn('Firebase SDK unavailable:',e));

 }catch(e){
   console.error('Login failed',e);
   const code=e?.code||e?.message||'';
   let msg='Login failed.';
   if(code==='INVALID_LOGIN_CREDENTIALS' || code==='INVALID_PASSWORD' || code==='EMAIL_NOT_FOUND' || code==='auth/invalid-credential')
     msg='Email या password गलत है।';
   else if(code==='INVALID_EMAIL') msg='Email सही format में डालें।';
   else if(code==='TOO_MANY_ATTEMPTS_TRY_LATER') msg='बहुत ज्यादा login attempts हुए हैं। थोड़ी देर बाद फिर कोशिश करें।';
   else if(code==='NETWORK_REQUEST_FAILED') msg='Internet connection check करें और फिर Login दबाएँ।';
   else if(e?.message==='Failed to fetch') msg='Internet connection या Firebase connection check करें।';
   else if(e?.message) msg=e.message;
   alert(msg);
   finishProcessing(false,0);
 }finally{
   const b=document.querySelector('button[onclick="doLogin()"]');
   if(b){b.disabled=false;b.textContent='Login';}
   if(document.getElementById('sseProcessingOverlay')?.classList.contains('show')) finishProcessing(false,0);
 }
}

 login();
}

function queueEvent({type,title,body,siteId='',siteName='',toRole='manager',toNames=[],recordId=''}){
  const ev={id:crypto.randomUUID(),type,title,body,siteId,siteName,toRole,toNames:Array.isArray(toNames)?toNames:[],recordId,
    fromName:state.user?.name||'System',fromRole:state.user?.role||'system',createdAt:new Date().toISOString(),status:'Sent',seenBy:[],acceptedBy:[]};
  state.notifications=Array.isArray(state.notifications)?state.notifications:[];
state.notificationReceipts=Array.isArray(state.notificationReceipts)?state.notificationReceipts:[];
  state.notifications.push(ev); if(state.notifications.length>300)state.notifications=state.notifications.slice(-300);
  localStorage.setItem(KEY,JSON.stringify(state));
  // Manager saves through the existing cloud sync; team phones append only this event.
  if(state.user?.role==='manager') save();
  else cloudRestAppendArray('notifications',ev).catch(e=>console.warn('Notification queue append failed',e));
  return ev;
}
function notificationMatches(ev){
 const u=state.user||{};

}

async function setupPushNotifications(){
 if(!('Notification' in window)||!('serviceWorker' in navigator)){alert('इस ब्राउज़र में Push Notification उपलब्ध नहीं है। HTTPS पर Chrome/Edge या समर्थित मोबाइल ब्राउज़र इस्तेमाल करें।');return;}
 try{
  const permission=await Notification.requestPermission();
  if(permission!=='granted'){alert('Notification permission नहीं मिली। Browser settings में अनुमति दें।');return;}
  if(!state.settings.pushVapidKey){alert('पहले Notifications पेज में VAPID key सेव करें। ऐप बंद होने पर Push के लिए server-side Cloud Function भी deploy होना चाहिए।');return;}
  if(!window.SSEFirebase?.ready){alert('Firebase SDK अभी तैयार नहीं है। इंटरनेट कनेक्शन जाँचें और फिर प्रयास करें।');return;}
  const {getMessaging,getToken,onMessage}=await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js');
  const reg=await navigator.serviceWorker.register('/firebase-messaging-sw.js');
  const messaging=getMessaging(window.SSEFirebase.app);
  const token=await getToken(messaging,{vapidKey:state.settings.pushVapidKey,serviceWorkerRegistration:reg});
  if(token){
   const authUser=window.SSEFirebase.user;
   if(!authUser?.uid){alert('Push token बना, लेकिन Firebase SDK login UID उपलब्ध नहीं है। दोबारा login करें और फिर Enable Push दबाएँ।');return;}
   await window.SSEFirebase.setDoc(window.SSEFirebase.doc(window.SSEFirebase.db,'pushTokens',authUser.uid),{uid:authUser.uid,name:state.user?.name||'',role:state.user?.role||'member',token,updatedAt:new Date().toISOString()},{merge:true});
   state.settings.pushEnabled=true;state.settings.pushTokenRegistered=true;save();alert('इस डिवाइस का Push token सुरक्षित सेव हुआ। ऐप बंद होने पर Push भेजने के लिए functions/ वाला sender Firebase पर deploy करना होगा।');
  }
  onMessage(messaging,payload=>{const n=payload?.notification||{};if(n.title&&Notification.permission==='granted')new Notification(n.title,{body:n.body||'SSE Reporting App में नया अपडेट है।'});});
 }catch(e){console.error('Push setup failed',e);alert('Push setup पूरा नहीं हुआ: '+(e.message||'Firebase configuration जाँचें।'));}
}

    queueEvent({type,title:type==='tbt'?'नई TBT Photo':'नया Work Permit',body:(permitType||notes||'नया रिकॉर्ड जमा हुआ').slice(0,140),siteId:site,siteName,toRole:'manager',recordId:record.id});

function assignmentMemberMatches(assignedId, member){
 const id=String(assignedId||'');
 if(!id||!member)return false;
 if(String(member.id||'')===id)return true;
 // Recover older assignments if a member record was recreated and its ID changed.
 const assignedMember=(state.members||[]).find(x=>String(x.id||'')===id);
 if(!assignedMember)return false;
 const emailA=String(assignedMember.email||'').trim().toLowerCase();
 const emailB=String(member.email||'').trim().toLowerCase();
 if(emailA&&emailB&&emailA===emailB)return true;
 const nameA=String(assignedMember.name||'').trim().toLowerCase();
 const nameB=String(member.name||'').trim().toLowerCase();
 return !!nameA&&nameA===nameB;
}
function memberAssignedSiteIds(member){

 // accepted assignment could appear in Notifications but not in Site/TBT forms.
 Object.entries(state.settings?.assignments||{}).forEach(([siteId,systems])=>{
   Object.values(systems||{}).forEach(a=>{

 });

async function submitAttendance(status){
 const site='Attendance';

 const btn=[...document.querySelectorAll('button')].find(b=>(b.textContent||'').includes('Submit Attendance'));
 if(btn){btn.disabled=true;btn.textContent='⏳ SAVING ATTENDANCE…';}
 const existingIndex=state.attendance.findIndex(x=>x.name===state.user.name&&x.date===today());
 const record={id:'attendance_'+state.user.name+'_'+today(),name:state.user.name,date:today(),siteName:site,status,photo:window._attendanceStampedPhoto,location:window._attendanceGPS};
 const previous=existingIndex>=0?state.attendance[existingIndex]:null;
 try{
   if(existingIndex>=0) state.attendance[existingIndex]=record;
   else state.attendance.push(record);
   const unique=new Map();
   state.attendance.forEach(a=>unique.set((a.name||'')+'|'+(a.date||''),a));
   state.attendance=[...unique.values()];
   save();
   let cloudOk=false;
   if(state.user?.role==='manager'){
     const token=state.authSession?.idToken;
     if(!token) throw new Error('Firebase session नहीं मिला। दोबारा login करें।');
     let payload=cloudPayload();
     const remote=await cloudRestGet();
     if(remote) payload=mergeIncomingSubmissions(payload,remote);
     payload.attendance=mergeRecordArrays([record],remote?.attendance||[]);
     payload.user=null;delete payload.authSession;
     const body={fields:{}};Object.entries(payload).forEach(([k,v])=>body.fields[k]=firestoreValue(v));
     const r=await fetch(FIRESTORE_DOC_URL,{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
     if(!r.ok) throw new Error('Firebase save failed (HTTP '+r.status+').');
     const verify=await cloudRestGet();
     cloudOk=Array.isArray(verify?.attendance)&&verify.attendance.some(a=>a.name===record.name&&a.date===record.date);
   }else{
     cloudOk=await cloudRestAppendArray('attendance',record);
   }
   if(!cloudOk) throw new Error('Firebase ने attendance save confirm नहीं की। Login, internet और Firestore rules जाँचें।');
   queueEvent({type:'attendance',title:'Attendance जमा हुई',body:state.user.name+' · '+status,siteName:site,toRole:'manager'});
   toast('✅ DONE — Attendance Firebase पर save हो गई।');
   attendanceForm();
 }catch(err){
   // Restore the local row so the UI does not falsely imply that cloud save succeeded.
   if(previous){state.attendance=state.attendance.map(a=>a.name===record.name&&a.date===record.date?previous:a);}
   else state.attendance=state.attendance.filter(a=>!(a.name===record.name&&a.date===record.date));
   localStorage.setItem(KEY,JSON.stringify(state));
   if(btn){btn.disabled=false;btn.textContent='❌ FAILED — Retry Attendance';}
   const msg='❌ FAILED — Attendance cloud में save नहीं हुई: '+(err?.message||'Network/login error');
   toast(msg);alert(msg);
 }
}

let v28LongPressTimer=null,v28LongPressTarget=null,v28LongPressTriggered=false;
function v28EditableTarget(el){
 // Never start the edit-on-long-press gesture from form controls. On touch
 // devices a checkbox/label press was bubbling to its surrounding card, which
 // opened an editor and made the current screen appear to jump/reset.
 if(state.user?.role!=='manager') return null;
 if(el?.closest?.('input,textarea,select,option,label,button,a,[role=button],[contenteditable="true"],.permit-check,.permit-type-grid,.labour-list,.v28-edit-modal')) return null;
 // Restrict long-press editing to actual editable dashboard/menu items only;
 // ordinary cards and form panels must never capture selection gestures.
 const t=el?.closest?.('[data-v28-route],[data-custom-menu-id],[data-dashboard-index],.dash-card,.module-choice,.module-dashboard-card,.custom-system-card');
 if(!t) return null;
 return t;
}
function v28Context(el){
 const route=el.getAttribute('data-v28-route')||'';
 const customId=el.getAttribute('data-custom-menu-id')||'';
 const itemIndex=el.getAttribute('data-custom-item-index');
 const dashIndex=el.getAttribute('data-dashboard-index');
 return {el,route,customId,itemIndex:itemIndex===''?null:(itemIndex==null?null:Number(itemIndex)),dashIndex:dashIndex===''?null:(dashIndex==null?null:Number(dashIndex))};
}
function v28StartLongPress(e){
 const t=v28EditableTarget(e.target); if(!t)return;
 v28LongPressTriggered=false;v28LongPressTarget=t;
 clearTimeout(v28LongPressTimer);
 v28LongPressTimer=setTimeout(()=>{v28LongPressTriggered=true;t.classList.add('longpress-editing');v28ShowHint('✏️ Long-press edit');setTimeout(()=>{t.classList.remove('longpress-editing');v28HideHint()},850);v28OpenEditor(v28Context(t));},650);

function v28OpenEditor(ctx){
 const {route,customId,itemIndex,dashIndex,el}=ctx;
 if(dashIndex!=null){return dashboardEditor()}
 if(customId && itemIndex!=null){return v28EditCustomSystem(customId,itemIndex)}
 if(customId){const i=customMenus().findIndex(m=>m.id===customId);if(i>=0)return editCustomMenu(i)}
 if(route==='customMenuEditor')return customMenuEditor();
 if(['dashboard','requests','reports','permitCheck','dailyHistory','team','visibility','admin'].includes(route)){
   if(route==='dashboard')return dashboardEditor();
   if(route==='team')return managerTeam();
   if(route==='visibility'||route==='admin')return managerVisibility();
 }
 return v28GenericEditor(el,route);
}
function v28GenericEditor(el,route){
 const old=el.getAttribute('data-v28-label')||el.querySelector('b')?.textContent?.trim()||el.textContent.trim().split(/\n/)[0].trim()||'Option';
 const icon=el.getAttribute('data-v28-icon')||'';
 const modal=document.createElement('div');modal.className='v28-edit-modal';modal.innerHTML=`<div class="v28-edit-box"><h3>✏️ Edit Option</h3><div class="muted">इस option का नाम और icon बदल सकते हैं।</div><label>Name / Title<input id="v28Title" value="${esc(old)}"></label><label>Icon / Logo<input id="v28Icon" value="${esc(icon)}" placeholder="📁"></label><div class="actions" style="margin-top:15px"><button class="btn primary" id="v28Save">💾 Save</button><button class="btn" id="v28Cancel">Cancel</button></div></div>`;document.body.appendChild(modal);
 modal.querySelector('#v28Cancel').onclick=()=>modal.remove();modal.querySelector('#v28Save').onclick=()=>{const title=modal.querySelector('#v28Title').value.trim();const ic=modal.querySelector('#v28Icon').value.trim();if(!title)return alert('Name / Title जरूरी है।');el.setAttribute('data-v28-label',title);el.setAttribute('data-v28-icon',ic);const key=route||('el_'+Array.from(document.querySelectorAll('button,.dash-card,.module-choice,.module-dashboard-card')).indexOf(el));state.settings.menuOverrides=state.settings.menuOverrides||{};state.settings.menuOverrides[key]={title,icon:ic};save();modal.remove();toast('Option updated');if(route)page(route);};
}
function v28EditCustomSystem(menuId,index){const m=customMenus().find(x=>x.id===menuId);if(!m)return;const old=(m.items||[])[index]||'';const modal=document.createElement('div');modal.className='v28-edit-modal';modal.innerHTML=`<div class="v28-edit-box"><h3>✏️ Edit System</h3><div class="muted">${esc(m.title)} के अंदर इस system को edit करें।</div><label>System Name<input id="v28Sys" value="${esc(old)}"></label><div class="actions" style="margin-top:15px"><button class="btn primary" id="v28Save">💾 Save</button><button class="btn danger" id="v28Del">🗑️ Delete</button><button class="btn" id="v28Cancel">Cancel</button></div></div>`;document.body.appendChild(modal);modal.querySelector('#v28Cancel').onclick=()=>modal.remove();modal.querySelector('#v28Del').onclick=()=>{if(confirm('इस system को हटाना है?')){m.items.splice(index,1);save();modal.remove();customMenuPage(menuId)}};modal.querySelector('#v28Save').onclick=()=>{const v=modal.querySelector('#v28Sys').value.trim();if(!v)return alert('System Name जरूरी है।');m.items[index]=v;save();modal.remove();toast('System updated');customMenuPage(menuId)}}

function ensureVisibility(){
  if(!state.visibility) state.visibility={};
  if(!state.siteVisibility) state.siteVisibility={};
  const mods=['tbt','workPermit','material','attendance'];
  mods.forEach(mod=>{
    if(!state.visibility[mod]) state.visibility[mod]={};
    (state.members||[]).forEach(m=>{
      if(!m.id)m.id=crypto.randomUUID();
      if(typeof state.visibility[mod][m.id]==='undefined') state.visibility[mod][m.id]=true;
      if(!state.siteVisibility[m.id]) state.siteVisibility[m.id]={};
      (state.sites||[]).forEach(site=>{if(typeof state.siteVisibility[m.id][site.id]==='undefined') state.siteVisibility[m.id][site.id]=true;});
    });
  });
}
